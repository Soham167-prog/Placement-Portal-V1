{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4">Company Registration</h3>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Official Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">HR Contact Number</label>
                    <input type="text" name="hr_contact" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Company Website</label>
                    <input type="text" name="website" class="form-control" placeholder="https://example.com" required>
                </div>

                <button type="submit" class="btn btn-warning w-100">
                    Register
                </button>

            </form>

            <div class="text-center mt-3">
                Already registered?
                <a href="/company/login">Login here</a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
